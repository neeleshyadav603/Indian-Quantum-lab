<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Navbar Rebuild Check</title>
</head>
<body>
    <pre id="results">Running...</pre>
    <script>
        const pages = [
            'index.html',
            'about.html',
            'contact.html',
            'courses.html',
            'learn.html',
            'blog.html',
            'research.html',
            'virtual-lab.html',
            'community.html',
            '404.html'
        ];
        const widths = [1200, 900, 769, 390];

        function loadFrame(page, width) {
            return new Promise((resolve) => {
                const iframe = document.createElement('iframe');
                iframe.src = '/' + page;
                iframe.style.width = width + 'px';
                iframe.style.height = '300px';
                iframe.style.border = '0';
                iframe.style.position = 'absolute';
                iframe.style.left = '-10000px';
                iframe.style.top = '0';
                iframe.onload = () => {
                    setTimeout(() => {
                        try {
                            const doc = iframe.contentDocument;
                            const nav = doc.querySelector('.navbar');
                            const container = doc.querySelector('.navbar-container');
                            const links = doc.querySelector('.navbar-links');
                            const actions = doc.querySelector('.navbar-actions');
                            const hamburger = doc.querySelector('.navbar-hamburger');
                            const mobile = doc.querySelector('.navbar-mobile');
                            const linkItems = Array.from(doc.querySelectorAll('.navbar-links > li'));
                            const navStyle = nav && getComputedStyle(nav);
                            const containerStyle = container && getComputedStyle(container);
                            const linksStyle = links && getComputedStyle(links);
                            const actionsStyle = actions && getComputedStyle(actions);
                            const hamburgerStyle = hamburger && getComputedStyle(hamburger);
                            const rects = linkItems.map((item) => item.getBoundingClientRect());
                            const firstTop = rects[0] ? Math.round(rects[0].top) : null;
                            const sameRow = width <= 768 || rects.every((rect) => Math.abs(Math.round(rect.top) - firstTop) <= 1);
                            const navRect = nav && nav.getBoundingClientRect();
                            const result = {
                                page,
                                width,
                                navPosition: navStyle && navStyle.position,
                                navHeight: navRect ? Math.round(navRect.height) : null,
                                navWidth: navRect ? Math.round(navRect.width) : null,
                                containerDisplay: containerStyle && containerStyle.display,
                                containerDirection: containerStyle && containerStyle.flexDirection,
                                containerAlign: containerStyle && containerStyle.alignItems,
                                linksDisplay: linksStyle && linksStyle.display,
                                linksDirection: linksStyle && linksStyle.flexDirection,
                                linksOverflowY: linksStyle && linksStyle.overflowY,
                                actionsDisplay: actionsStyle && actionsStyle.display,
                                hamburgerDisplay: hamburgerStyle && hamburgerStyle.display,
                                sameRow,
                                duplicateMobileMenus: doc.querySelectorAll('.navbar-mobile, .navbar-mobile-list').length,
                                mobileInitiallyHidden: true,
                                mobileOpens: null
                            };
                            let mobileOpens = null;

                            iframe.remove();
                            resolve(result);
                        } catch (error) {
                            iframe.remove();
                            resolve({ page, width, error: String(error) });
                        }
                    }, 150);
                };
                document.body.appendChild(iframe);
            });
        }

        (async function run() {
            const results = await Promise.all(pages.flatMap((page) => widths.map((width) => loadFrame(page, width))));
            const failures = results.filter((item) => {
                if (item.error) return true;
                if (item.navPosition !== 'fixed') return true;
                if (item.navHeight !== 72) return true;
                if (item.containerDisplay !== 'flex' || item.containerDirection !== 'row') return true;
                if (item.containerAlign !== 'center') return true;
                if (item.actionsDisplay !== 'inline-flex' && item.actionsDisplay !== 'flex') return true;
                if (item.duplicateMobileMenus !== 0) return true;

                return item.linksDisplay !== 'flex' ||
                    item.linksDirection !== 'row' ||
                    item.hamburgerDisplay !== 'none' ||
                    item.sameRow !== true;
            });

            document.getElementById('results').textContent = JSON.stringify({
                checked: results.length,
                failures: failures.length,
                pages,
                widths,
                failureDetails: failures
            }, null, 2);
        }());
    </script>
</body>
</html>
